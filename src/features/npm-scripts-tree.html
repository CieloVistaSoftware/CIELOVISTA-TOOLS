<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline';">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--vscode-font-family);font-size:13px;color:var(--vscode-editor-foreground);background:var(--vscode-editor-background)}

#toolbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;
  background:var(--vscode-sideBar-background);
  border-bottom:1px solid var(--vscode-panel-border)
}
#filter{
  flex:1;padding:5px 10px;
  border:1px solid var(--vscode-panel-border);border-radius:4px;
  background:var(--vscode-input-background);color:var(--vscode-input-foreground);
  font-family:inherit;font-size:12px;outline:none
}
#filter:focus{border-color:var(--vscode-focusBorder)}
#filter::placeholder{color:var(--vscode-input-placeholderForeground)}
#btn-refresh{
  background:var(--vscode-button-secondaryBackground);
  color:var(--vscode-button-secondaryForeground);
  border:none;padding:5px 12px;border-radius:4px;
  cursor:pointer;font-size:12px;white-space:nowrap
}
#btn-refresh:hover{background:var(--vscode-button-secondaryHoverBackground)}

#content{padding:4px 0}

.pkg-group{margin-bottom:1px}

.pkg-header{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;cursor:pointer;user-select:none;
  font-size:11px;font-weight:700;
  color:var(--vscode-descriptionForeground);
  letter-spacing:.03em;
  background:var(--vscode-sideBar-background);
  border-bottom:1px solid var(--vscode-panel-border)
}
.pkg-header:hover{background:var(--vscode-list-hoverBackground);color:var(--vscode-editor-foreground)}
.pkg-arrow{font-size:9px;transition:transform .12s;display:inline-block;width:10px;flex-shrink:0}
.pkg-arrow.open{transform:rotate(90deg)}
.pkg-name{font-weight:700;white-space:nowrap}
.pkg-rel{
  font-family:var(--vscode-editor-font-family,monospace);
  font-size:10px;opacity:.6;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  flex:1;min-width:0
}
.pkg-count{font-size:10px;font-weight:400;opacity:.65;margin-left:4px;white-space:nowrap}

.script-list{display:none}
.script-list.open{display:block}

.script-row{
  display:grid;
  grid-template-columns:minmax(130px,1.2fr) minmax(0,2fr) auto auto;
  align-items:center;gap:8px;
  padding:4px 14px 4px 32px;
  border-bottom:1px solid transparent
}
.script-row:hover{background:var(--vscode-list-hoverBackground)}
.script-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.script-cmd{
  font-family:var(--vscode-editor-font-family,monospace);
  font-size:10px;color:var(--vscode-descriptionForeground);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
/* Rows with a "scripts-info" description: name over description, command in the tooltip */
.script-row.has-desc{grid-template-columns:minmax(0,1fr) auto auto;align-items:start;padding-top:5px;padding-bottom:5px}
.script-main{min-width:0}
.script-desc{font-size:12px;color:var(--vscode-descriptionForeground);line-height:1.4;margin-top:1px}
.script-row.has-desc .script-cmd{display:block;margin-top:2px;opacity:.75}

/* "scripts-groups" sections inside one package */
.sg-header{
  display:flex;align-items:center;gap:6px;
  padding:5px 14px 5px 24px;cursor:pointer;user-select:none;
  font-size:12px;font-weight:600;
  border-bottom:1px solid var(--vscode-panel-border)
}
.sg-header:hover{background:var(--vscode-list-hoverBackground)}
.sg-count{font-size:10px;font-weight:400;opacity:.65}
.sg-list{display:none}
.sg-list.open{display:block}

.btn-run{
  background:var(--vscode-button-background);
  color:var(--vscode-button-foreground);
  border:none;border-radius:3px;padding:2px 10px;
  cursor:pointer;font-size:11px;font-weight:600;
  white-space:nowrap;flex-shrink:0;
  transition:background .15s,color .15s,box-shadow .15s
}
.btn-run:hover{background:var(--vscode-button-hoverBackground)}
/* running=green glow (terminal opened), ok=green solid (exit 0), error=red (exit!=0) */
.btn-run.running{background:#1a7f37!important;color:#fff!important;box-shadow:0 0 5px #3fb950}
.btn-run.ok     {background:#1a7f37!important;color:#fff!important}
.btn-run.ok:hover{background:#238a42}
.btn-run.error  {background:#b91c1c!important;color:#fff!important;box-shadow:0 0 5px #f85149}
.btn-run.error:hover{background:#c72323}
.btn-issue{
  background:var(--vscode-button-secondaryBackground);
  color:var(--vscode-button-secondaryForeground);
  border:none;border-radius:3px;padding:2px 8px;
  cursor:pointer;font-size:11px;font-weight:600;
  white-space:nowrap;flex-shrink:0;
}
.btn-issue:hover{background:var(--vscode-button-secondaryHoverBackground)}

#empty{padding:24px 20px;font-size:12px;color:var(--vscode-descriptionForeground);display:none}
#loading{padding:24px 20px;font-size:12px;color:var(--vscode-descriptionForeground)}
</style>
</head>
<body>

<div id="toolbar">
  <select id="project-picker" title="Switch project — defaults to current workspace" style="padding:5px 8px;border:1px solid var(--vscode-panel-border);border-radius:4px;background:var(--vscode-dropdown-background);color:var(--vscode-dropdown-foreground);font-family:inherit;font-size:12px;cursor:pointer;max-width:200px"><option value="">Current workspace</option></select>
  <input id="filter" type="text" placeholder="Filter scripts…" autocomplete="off" spellcheck="false">
  <button id="btn-refresh">↻ Refresh</button>
</div>

<div id="loading">Loading scripts…</div>
<div id="empty">No package.json files with scripts found in this workspace.</div>
<div id="content"></div>

<script>
(function(){
var vsc = acquireVsCodeApi();
var content  = document.getElementById('content');
var loading  = document.getElementById('loading');
var empty    = document.getElementById('empty');
var filter   = document.getElementById('filter');
var picker   = document.getElementById('project-picker');

picker.addEventListener('change', function() {
  filter.value = '';
  loading.style.display = 'block';
  content.style.display = 'none';
  empty.style.display   = 'none';
  vsc.postMessage({ type: 'switchProject', projectPath: picker.value });
});

// ── Render ────────────────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var SCRIPT_DESCRIPTIONS = {
  'compile':              'Bundles TypeScript source via esbuild into out/',
  'typecheck':            'Type-checks TypeScript without emitting files',
  'watch':                'Starts TypeScript compiler in watch mode — recompiles on every save',
  'build':                'Alias for compile',
  'package':              'Packages the extension into a .vsix file via vsce',
  'rebuild':              'Full clean + compile + package + install cycle — ⚠ Slow (30–60 sec)',
  'clean:project':        'Shows what clean:project:apply would delete — dry run, no changes',
  'clean:project:apply':  '⚠ Deletes all generated/temp files — irreversible without git',
  'docs:generate':        'Auto-generates feature README stubs from src/features/',
  'copy:commandhelp':     'Copies CommandHelp .md files into out/ for packaging',
  'validate:package-json': 'Validates package.json structure and required fields',
  'test:catalog':         'Runs catalog integrity tests',
  'test:catalog:no-mutate': 'Runs catalog tests in read-only mode (no file writes)',
  'test:commands':        'Validates all documented commands exist and are registered',
  'test:preflight':       'Runs preflight regression checks before committing',
  'test:regression':      'Runs all regression tests (REG-*.test.js) — aborts if any fail',
  'test:activation':      'Runs VS Code extension activation tests',
};

function runBtnTitle(name, cmd, own) {
  var desc = own || SCRIPT_DESCRIPTIONS[name];
  var lines = [];
  if (desc) { lines.push(desc); }
  lines.push('Run: ' + cmd);
  lines.push('Output: opens in terminal panel beside editor');
  lines.push('Error: non-zero exit code highlighted in red');
  return lines.join('\n');
}

// One script row. With a "scripts-info" description the name sits over the
// description and the raw command is small below it; without one, the row is
// name | command | Run as it always was.
// Hover text for a described row: what and when (description), whether to run
// it at all (its group), and how (the full command).
function rowTitle(s, group){
  var lines = [s.desc];
  if (group) { lines.push('', 'Group: ' + group); }
  lines.push('', 'Runs: ' + s.cmd);
  return lines.join('\n');
}

function scriptRow(e, s, group){
  var row = document.createElement('div');
  row.className = 'script-row' + (s.desc ? ' has-desc' : '');
  row.dataset.name = s.name.toLowerCase();
  row.dataset.cmd  = s.cmd.toLowerCase();
  row.dataset.desc = (s.desc || '').toLowerCase();
  var key = e.absDir + '|||' + s.name;
  // Without a description the row keeps today's command-only tooltip
  var tip = s.desc ? rowTitle(s, group) : s.cmd;
  if (s.desc) { row.title = tip; }
  var cmd = '<span class="script-cmd" title="' + esc(tip) + '">' + esc(s.cmd) + '</span>';
  var name = '<span class="script-name" title="' + esc(tip) + '">' + esc(s.name) + '</span>';
  row.innerHTML =
    (s.desc
      ? '<div class="script-main">' + name + '<div class="script-desc">' + esc(s.desc) + '</div>' + cmd + '</div>'
      : name + cmd) +
    '<button class="btn-run" data-dir="' + esc(e.absDir) + '" data-script="' + esc(s.name) + '" data-key="' + esc(key) + '" title="' + esc(runBtnTitle(s.name, s.cmd, s.desc)) + '">&#9654; Run</button>';
  return row;
}

function render(entries){
  loading.style.display = 'none';
  content.innerHTML = '';

  if(!entries || !entries.length){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  entries.forEach(function(e, gi){
    var grp = document.createElement('div');
    grp.className = 'pkg-group';
    grp.dataset.group = gi;

    var hd = document.createElement('div');
    hd.className = 'pkg-header';
    hd.innerHTML =
      '<span class="pkg-arrow open">&#9654;</span>' +
      '<span class="pkg-name">' + esc(e.label) + '</span>' +
      '<span class="pkg-count">(' + e.scripts.length + ')</span>' +
      '<span class="pkg-rel" title="' + esc(e.relPath) + '">' + esc(e.relPath) + '</span>';

    var list = document.createElement('div');
    list.className = 'script-list open';

    var byName = {};
    e.scripts.forEach(function(s){ byName[s.name] = s; });
    if(e.groups && e.groups.length){
      // "scripts-groups": one collapsible section per group, in the package's order
      e.groups.forEach(function(g){
        var sh = document.createElement('div');
        sh.className = 'sg-header';
        sh.innerHTML =
          '<span class="pkg-arrow' + (g.collapsed ? '' : ' open') + '">&#9654;</span>' +
          '<span class="sg-name">' + esc(g.heading) + '</span>' +
          '<span class="sg-count">(' + g.scripts.length + ')</span>';
        var sl = document.createElement('div');
        sl.className = 'sg-list' + (g.collapsed ? '' : ' open');
        sl.dataset.defaultOpen = g.collapsed ? '0' : '1';
        g.scripts.forEach(function(n){ if(byName[n]){ sl.appendChild(scriptRow(e, byName[n], g.heading)); } });
        sh.addEventListener('click', function(){
          var open = sl.classList.toggle('open');
          sh.querySelector('.pkg-arrow').classList.toggle('open', open);
        });
        var sec = document.createElement('div');
        sec.className = 'script-group';
        sec.appendChild(sh);
        sec.appendChild(sl);
        list.appendChild(sec);
      });
    } else {
      e.scripts.forEach(function(s){ list.appendChild(scriptRow(e, s)); });
    }

    // collapse toggle
    hd.addEventListener('click', function(){
      var open = list.classList.toggle('open');
      hd.querySelector('.pkg-arrow').classList.toggle('open', open);
    });

    // run buttons
    list.querySelectorAll('.btn-run').forEach(function(btn){
      btn.addEventListener('click', function(ev){
        ev.stopPropagation();
        vsc.postMessage({ type:'run', dir:btn.dataset.dir, script:btn.dataset.script });
        setBtn(btn, 'running');
      });
    });

    grp.appendChild(hd);
    grp.appendChild(list);
    content.appendChild(grp);
  });
}

// ── Filter ────────────────────────────────────────────────────────────────────
filter.addEventListener('input', function(){
  var q = filter.value.toLowerCase().trim();
  document.querySelectorAll('.pkg-group').forEach(function(grp){
    var any = false;
    grp.querySelectorAll('.script-row').forEach(function(row){
      var show = !q || row.dataset.name.includes(q) || row.dataset.cmd.includes(q) || row.dataset.desc.includes(q);
      row.style.display = show ? '' : 'none';
      if(show){ any = true; }
    });
    grp.querySelectorAll('.script-group').forEach(function(sec){
      var hits = Array.prototype.some.call(sec.querySelectorAll('.script-row'), function(r){ return r.style.display !== 'none'; });
      sec.style.display = (hits || !q) ? '' : 'none';
      // A match opens its section; clearing the filter puts each section back to its default
      var sl = sec.querySelector('.sg-list');
      var open = q ? hits : sl.dataset.defaultOpen === '1';
      sl.classList.toggle('open', open);
      sec.querySelector('.pkg-arrow').classList.toggle('open', open);
    });
    grp.style.display = (any || !q) ? '' : 'none';
    if(q && any){
      grp.querySelector('.script-list').classList.add('open');
      grp.querySelector('.pkg-arrow').classList.add('open');
    }
  });
});

// ── Refresh ───────────────────────────────────────────────────────────────────
document.getElementById('btn-refresh').addEventListener('click', function(){
  loading.style.display = 'block';
  content.innerHTML = '';
  empty.style.display = 'none';
  filter.value = '';
  vsc.postMessage({ type:'refresh' });
});

// ── Button state helper ───────────────────────────────────────────────────────
function setBtn(btn, state){
  // Remove any issue button from a previous error state
  var prev = btn.nextElementSibling;
  if(prev && prev.classList.contains('btn-issue')){ prev.remove(); }

  btn.classList.remove('running','ok','error');
  if(state === 'running'){
    btn.classList.add('running');
    btn.innerHTML = '&#9654; Run'; // stays as ▶ Run but turns green immediately (#512)
  } else if(state === 'ok'){
    btn.classList.add('ok');
    btn.innerHTML = '&#10003; Run';
  } else if(state === 'error'){
    btn.classList.add('error');
    btn.innerHTML = '&#8635; Retry';
    var ib = document.createElement('button');
    ib.className = 'btn-issue';
    ib.textContent = '📋 Issue';
    ib.dataset.dir    = btn.dataset.dir;
    ib.dataset.script = btn.dataset.script;
    ib.addEventListener('click', function(ev){
      ev.stopPropagation();
      vsc.postMessage({ type:'create-issue', dir:btn.dataset.dir, script:btn.dataset.script });
    });
    btn.parentNode.insertBefore(ib, btn.nextSibling);
  }
}

// ── Messages from host ────────────────────────────────────────────────────────
window.addEventListener('message', function(e){
  var msg = e.data;
  if(!msg){ return; }
  if(msg.type === 'init'){
    // Populate project picker on first init (when projects list is provided)
    if(msg.projects && msg.projects.length > 0){
      var currentVal = picker.value;
      // Clear all options except the first (current workspace)
      while(picker.options.length > 1){ picker.remove(1); }
      msg.projects.forEach(function(p){
        var opt = document.createElement('option');
        opt.value = p.path;
        opt.textContent = p.name;
        picker.appendChild(opt);
      });
      // Restore selection or set to currentPath
      if(msg.currentPath){ picker.value = msg.currentPath; }
      else if(currentVal){ picker.value = currentVal; }
    }
    render(msg.entries);
    return;
  }
  if(msg.type === 'run-state'){
    var key = msg.dir + '|||' + msg.script;
    var btn = null;
    document.querySelectorAll('.btn-run[data-key]').forEach(function(el){
      if(el.getAttribute('data-key') === key){ btn = el; }
    });
    if(btn){ setBtn(btn, msg.state); }
  }
});

// Tell the host we are ready
vsc.postMessage({ type:'ready' });
})();
</script>
</body>
</html>
